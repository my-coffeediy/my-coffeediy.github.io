name: Update Daily News

on:
  workflow_dispatch:
  push:
    paths:
      - "news/scripts/update_news.py"
      - "news/scripts/add_quick_briefs.py"
      - "news/requirements.txt"
      - ".github/workflows/update-news.yml"
  schedule:
    # UTC 00:00 / 04:00 / 12:00 = 北京时间 08:00 / 12:00 / 20:00
    - cron: "0 0 * * *"
    - cron: "0 4 * * *"
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: daily-news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r news/requirements.txt
      - name: Refresh news and markets
        run: python news/scripts/update_news.py
      - name: Add quick briefs for every story
        run: python news/scripts/add_quick_briefs.py
      - name: Commit refreshed data
        run: |
          git config user.name "daily-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news/data/news.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh daily news"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

# Daily Brief v3: source weighting, Top 5 ranking, thumbnails, summaries and quick-overview popups.
