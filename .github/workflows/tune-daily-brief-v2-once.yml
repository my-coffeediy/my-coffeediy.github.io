name: Tune Daily Brief V2 Once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tune-daily-brief-v2-once.yml"

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch ranking
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('news/scripts/update_news.py')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
              'SOURCE_TIER_3=["中国新闻网","中新网","央广网","经济日报","中国经济网","财联社","第一财经","澎湃新闻","证券时报","上海证券报","中国证券报","路透","Reuters","AP","美联社","BBC"]',
              'SOURCE_TIER_3=["中国新闻网","中新网","央广网","国际在线","经济日报","中国经济网","财联社","第一财经","澎湃新闻","thepaper.cn","证券时报","上海证券报","中国证券报","路透","Reuters","AP","美联社","BBC"]'
          )
          s=s.replace(
              'SOURCE_TIER_2=["界面新闻","新京报","中青在线","南方日报","北京日报","解放日报","21世纪经济报道","每日经济新闻"]',
              'SOURCE_TIER_2=["界面新闻","新京报","中青在线","南方日报","北京日报","解放日报","21世纪经济报道","每日经济新闻","联合早报","华尔街日报","cn.wsj.com","纽约时报中文网","日经中文网","彭博","Bloomberg","华尔街见闻"]'
          )

          old='TOP_BLOCK=["新书","研究会","会员代表大会","时装周","圆满举办","宣传周","宣传月","启动仪式","限时优惠","现金激励","ETF","减持","质押","保荐","违规被罚","实干样本","品牌活动","视频"]'
          new='TOP_BLOCK=["新书","研究会","会员代表大会","时装周","圆满举办","宣传周","宣传月","启动仪式","限时优惠","现金激励","ETF","减持","质押","保荐","违规被罚","实干样本","品牌活动","视频","研讨会","交流活动","道歉","市场汇价","开学典礼","体育","比赛","白鹭","早报"]'
          if old not in s:
              raise SystemExit('TOP_BLOCK marker missing')
          s=s.replace(old,new,1)
          s=s.replace('"国家主席","总书记"]','"国家主席","总书记","教育部","人社部","公安部","市场监管总局"]',1)

          a=s.index('def is_top_candidate(key,item,strict=True):')
          b=s.index('\ndef build_top5(sections):',a)
          helper='''def is_top_candidate(key,item,strict=True):\n    title=item["title"]\n    if any(w in title for w in CLICKBAIT+TOP_BLOCK):return False\n    major=any(w.lower() in title.lower() for w in TOP_MAJOR[key])\n    if key=="world":\n        if item.get("_tier",1)<2 and not (item.get("_feed_bonus",0)>=5 and major):return False\n    else:\n        if item.get("_tier",1)<2:return False\n    if key=="ai" and item.get("_tier",1)<2:return False\n    if strict and not major:return False\n    return True\n'''
          s=s[:a]+helper+s[b:]

          a=s.index('def build_top5(sections):')
          b=s.index('\nMARKETS=[',a)
          build='''def build_top5(sections):\n    used=set(); chosen=[]\n    def add_best(key,strict=True):\n        for x in sections[key]:\n            n=norm_text(x["title"])\n            if n in used:continue\n            if is_top_candidate(key,x,strict):\n                used.add(n); chosen.append((key,x)); return True\n        return False\n    for _ in range(2):\n        if not add_best("china",True):add_best("china",False)\n    if not add_best("world",True):add_best("world",False)\n    block=[]\n    for k in ("society","finance"):\n        for x in sections[k]:\n            if is_top_candidate(k,x,True):block.append((x["_score"],k,x))\n    block.sort(key=lambda z:(z[0],z[2]["_tier"],z[2]["published_at"]),reverse=True)\n    for _,k,x in block:\n        n=norm_text(x["title"])\n        if n not in used:\n            used.add(n);chosen.append((k,x));break\n    block=[]\n    for k in ("ai","tech","finance","society"):\n        for x in sections[k]:\n            if is_top_candidate(k,x,True):\n                bonus=2 if k=="ai" else (1 if k=="tech" else 0)\n                block.append((x["_score"]+bonus,k,x))\n    block.sort(key=lambda z:(z[0],z[2]["_tier"],z[2]["published_at"]),reverse=True)\n    for _,k,x in block:\n        n=norm_text(x["title"])\n        if n not in used:\n            used.add(n);chosen.append((k,x));break\n    if len(chosen)<5:\n        pool=[]\n        for k in ("china","world","society","finance","tech","ai"):\n            for x in sections[k]:\n                if is_top_candidate(k,x,False):pool.append((x["_score"],k,x))\n        pool.sort(key=lambda z:(z[0],z[2]["_tier"],z[2]["published_at"]),reverse=True)\n        for _,k,x in pool:\n            n=norm_text(x["title"])\n            if n in used:continue\n            used.add(n);chosen.append((k,x))\n            if len(chosen)>=5:break\n    return [pack_top(k,x) for k,x in chosen[:5]]\n'''
          s=s[:a]+build+s[b:]

          old_cleanup='''            item.pop("_tier",None)\n            item.pop("_score",None)\n'''
          new_cleanup='''            item.pop("_tier",None)\n            item.pop("_score",None)\n            item.pop("_feed_bonus",None)\n'''
          if old_cleanup in s:
              s=s.replace(old_cleanup,new_cleanup,1)

          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile news/scripts/update_news.py
      - name: Install dependencies
        run: pip install -r news/requirements.txt
      - name: Refresh and validate
        run: |
          python news/scripts/update_news.py
          python - <<'PY'
          import json
          d=json.load(open('news/data/news.json',encoding='utf-8'))
          t=d['top5']
          assert len(t)==5
          assert sum(x.get('category')=='国内' for x in t)>=2
          assert any(x.get('category')=='国际' for x in t)
          bad=('研讨会','交流活动','道歉','市场汇价','限时优惠','时装周')
          assert not any(any(w in x.get('title','') for w in bad) for x in t)
          assert not any('_feed_bonus' in x for arr in d['sections'].values() for x in arr)
          for x in t:
              print(x['category'],x['source'],x['title'])
          PY
      - name: Commit tuned updater and data
        run: |
          git config user.name "daily-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news/scripts/update_news.py news/data/news.json
          git commit -m "improve: tune daily brief headline mix"
          git pull --rebase origin main
          git push origin HEAD:main
