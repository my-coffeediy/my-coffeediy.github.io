name: Hard News Final Once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/hard-news-final-once.yml"

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prefer hard news in Top 5
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('news/scripts/update_news.py')
          s=p.read_text(encoding='utf-8')
          old='TOP_BLOCK=["新书","研究会","会员代表大会","时装周","圆满举办","宣传周","宣传月","启动仪式","限时优惠","现金激励","ETF","减持","质押","保荐","违规被罚","实干样本","品牌活动","视频","研讨会","交流活动","道歉","市场汇价","开学典礼","体育","比赛","白鹭","早报","大赛","决赛","启幕","执法检查组","本周","日程","周历"]'
          new='TOP_BLOCK=["新书","研究会","会员代表大会","时装周","圆满举办","宣传周","宣传月","启动仪式","限时优惠","现金激励","ETF","减持","质押","保荐","违规被罚","实干样本","品牌活动","视频","研讨会","交流活动","道歉","市场汇价","开学典礼","体育","比赛","白鹭","早报","大赛","决赛","启幕","执法检查组","本周","日程","周历","头图"]'
          if old not in s: raise SystemExit('TOP_BLOCK marker missing')
          s=s.replace(old,new,1)
          old_reason='if any(k in t for k in ("地震","台风","暴雨","洪涝","事故","伤亡","失联")):'
          new_reason='if any(k in t for k in ("地震","台风","暴雨","洪涝","事故","伤亡","失联","灾害","救灾","紧急转移","滑坡","泥石流")):'
          if old_reason not in s: raise SystemExit('reason marker missing')
          s=s.replace(old_reason,new_reason,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile news/scripts/update_news.py
      - name: Install dependencies
        run: pip install -r news/requirements.txt
      - name: Refresh and validate
        run: |
          python news/scripts/update_news.py
          python - <<'PY'
          import json
          d=json.load(open('news/data/news.json',encoding='utf-8'))
          assert len(d['top5'])==5
          assert not any('头图' in x.get('title','') for x in d['top5'])
          assert sum(x.get('category')=='国内' for x in d['top5'])>=2
          assert any(x.get('category')=='国际' for x in d['top5'])
          for x in d['top5']: print(x['category'],x['source'],x['title'])
          PY
      - name: Commit final ranking
        run: |
          git config user.name "daily-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news/scripts/update_news.py news/data/news.json
          git commit -m "improve: prefer hard news in daily Top 5"
          git pull --rebase origin main
          git push origin HEAD:main
