name: Fix Daily News Script Once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-news-script-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair syntax typo and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('news/scripts/update_news.py')
          s = p.read_text(encoding='utf-8')
          bad = 'str(enc.get("type","""))'
          good = 'str(enc.get("type",""))'
          if bad not in s:
              raise SystemExit('Expected typo not found; refusing to change anything else')
          s = s.replace(bad, good, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile news/scripts/update_news.py
      - name: Commit repair
        run: |
          git config user.name "daily-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news/scripts/update_news.py
          git commit -m "fix: repair daily news updater syntax"
          git push
