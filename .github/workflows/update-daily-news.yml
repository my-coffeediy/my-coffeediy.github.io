name: Update Daily News
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 4 * * *"
    - cron: "0 12 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r news/requirements.txt
      - run: python news/scripts/update_news.py
      - name: Commit updated data
        run: |
          git config user.name "daily-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news/data/news.json
          git diff --cached --quiet || git commit -m "chore: update daily news"
          git push
