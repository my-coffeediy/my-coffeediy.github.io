name: Test Bing Image Once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/test-bing-image-once.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Bing image HTML
        run: |
          python - <<'PY'
          import re, html, urllib.parse, urllib.request
          title='3000亿 财政部 密集注资 银行 保险公司'
          url='https://www.bing.com/images/search?q='+urllib.parse.quote(title)+'&setlang=zh-cn'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          text=html.unescape(urllib.request.urlopen(req,timeout=10).read().decode('utf-8','ignore'))
          patterns=[
            r'"turl"\s*:\s*"(https:[^"\\]+)',
            r'"thumbnailUrl"\s*:\s*"(https:[^"\\]+)',
            r'(https://tse[0-9]+\.mm\.bing\.net/th[^"\'<> ]+)',
            r'murl&quot;:&quot;(https?://[^&]+)'
          ]
          for pat in patterns:
              m=re.search(pat,text,re.I)
              print('MATCH',bool(m), (m.group(1)[:300] if m else ''))
          print('html_len',len(text))
          PY
