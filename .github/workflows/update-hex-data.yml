name: Update Hex Arena data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 20 * * 2"

permissions:
  contents: write

concurrency:
  group: update-hex-arena-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh ResG data
        run: node hex-arena-cn/scripts/update-data.mjs
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hex-arena-cn/data
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: refresh Hex Arena statistics"
          git push
