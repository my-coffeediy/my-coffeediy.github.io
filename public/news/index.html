<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="中国新闻为主、全球头条精选、财经科技社会、AI快报与国际资源行情。" />
  <title>今日简报 · 每日新闻</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar"><div><div class="eyebrow">DAILY BRIEF</div><h1>今日简报</h1></div><button id="refreshBtn" class="ghost-btn">↻ 刷新</button></header>
    <section class="meta-card"><div><div id="todayDate" class="date"></div><div id="updatedAt" class="muted">正在读取最新数据…</div></div><div class="status-pill"><span class="dot"></span> 自动更新</div></section>
    <nav class="tabs"><button class="tab active" data-tab="overview">总览</button><button class="tab" data-tab="china">国内</button><button class="tab" data-tab="world">国际</button><button class="tab" data-tab="finance">财经</button><button class="tab" data-tab="tech">科技</button><button class="tab" data-tab="society">社会</button><button class="tab" data-tab="ai">AI快报</button><button class="tab" data-tab="markets">资源行情</button></nav>
    <main>
      <section class="panel tab-panel active" data-panel="overview"><div class="section-head"><div><div class="eyebrow">TOP 5</div><h2>今天你只需要知道这 5 件事</h2></div></div><div id="top5" class="top-list"></div><div class="split-grid"><section><div class="section-head compact"><h2>中国重点</h2><span>优先展示</span></div><div id="chinaPreview" class="news-list"></div></section><section><div class="section-head compact"><h2>全球头条</h2><span>只看大事</span></div><div id="worldPreview" class="news-list"></div></section></div><section class="markets-card"><div class="section-head compact"><h2>国际资源涨跌</h2><span id="marketTime"></span></div><div id="marketStrip" class="market-strip"></div></section><section><div class="section-head compact"><h2>AI 快报</h2><span>模型 · 产品 · 行业</span></div><div id="aiPreview" class="news-list"></div></section></section>
      <section class="panel tab-panel" data-panel="china"><div class="section-head"><h2>国内新闻</h2></div><div id="chinaList" class="news-list"></div></section>
      <section class="panel tab-panel" data-panel="world"><div class="section-head"><h2>国际头条</h2></div><div id="worldList" class="news-list"></div></section>
      <section class="panel tab-panel" data-panel="finance"><div class="section-head"><h2>财经</h2></div><div id="financeList" class="news-list"></div></section>
      <section class="panel tab-panel" data-panel="tech"><div class="section-head"><h2>科技</h2></div><div id="techList" class="news-list"></div></section>
      <section class="panel tab-panel" data-panel="society"><div class="section-head"><h2>社会</h2></div><div id="societyList" class="news-list"></div></section>
      <section class="panel tab-panel" data-panel="ai"><div class="section-head"><h2>AI 快报</h2></div><div id="aiList" class="news-list"></div></section>
      <section class="panel tab-panel" data-panel="markets"><div class="section-head"><h2>国际资源行情</h2></div><div id="marketsGrid" class="markets-grid"></div><p class="disclaimer">行情用于信息浏览，不构成投资建议。不同交易所与数据源报价可能存在延迟或差异。</p></section>
    </main>
    <footer><p>新闻以中国为主，全球仅保留重点头条。来源会随每条新闻显示。</p><p>自动更新：08:00 / 12:00 / 20:00（北京时间）</p></footer>
  </div>
  <script src="./app.js"></script>
</body>
</html>
